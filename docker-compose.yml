services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-local_first_tasks}
      POSTGRES_USER: ${POSTGRES_USER:-local_first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_first_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - local-first-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-local_first} -d ${POSTGRES_DB:-local_first_tasks}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-local_first_tasks}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-local_first}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local_first_dev}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - local-first-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

networks:
  local-first-network:
    driver: bridge

volumes:
  postgres-data:
